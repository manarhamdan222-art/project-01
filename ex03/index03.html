<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists &amp; Tables</title>
</head>
<body>
    <ul>
        <li>C</li>
        <li>C++</li>
        <li>Python</li>
    </ul>

    <ol>
        <li>Read the subject carefully.</li>
        <li>Design the structure:
            <ul>
                <li>Draft layout on paper</li>
                <li>Write semantic markup</li>
            </ul>
        </li>
        <li>Validate with W3C validator.</li>
    </ol>

    <table>
        <caption>Weekly Schedule</caption>
        <thead>
            <tr>
                <th scope="col">Day</th>
                <th scope="col">Topic</th>
                <th scope="col">Hours</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>HTML Basics</td>
                <td>4</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>Forms &amp; Semantic Layout</td>
                <td>5</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
